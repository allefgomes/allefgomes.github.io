{% if paginator.total_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if paginator.previous_page %}
  <a class="btn sm magnetic" href="{{ site.baseurl }}{{ paginator.previous_page_path }}">← Newer</a>
  {% endif %}
  <span>Page {{ paginator.page }} / {{ paginator.total_pages }}</span>
  {% if paginator.next_page %}
  <a class="btn sm magnetic" href="{{ site.baseurl }}{{ paginator.next_page_path }}">Older →</a>
  {% endif %}
</nav>
{% endif %}
