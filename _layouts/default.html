<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
<script>document.documentElement.classList.add('js');</script>

<div class="bg-fx" aria-hidden="true"><div class="blob a"></div><div class="blob b"></div><div class="grain"></div></div>

<header class="nav">
  <div class="wrap">
    <a class="mark" href="{{ site.baseurl }}/" aria-label="{{ site.author }}, portfolio"><i>AG</i>{{ site.author }}</a>
    <ul>
      <li><a href="{{ site.baseurl }}/"><span>01</span>Portfolio</a></li>
      <li><a href="{{ site.baseurl }}/blog/"{% if page.url contains '/blog/' or page.layout == 'post' %} aria-current="page"{% endif %}><span>02</span>Blog</a></li>
      <li><a href="{{ site.baseurl }}/tags/"{% if page.url == '/tags/' %} aria-current="page"{% endif %}><span>03</span>Tags</a></li>
    </ul>
    <a class="btn sm solid magnetic" href="{{ site.baseurl }}/#contact">Get in touch</a>
  </div>
  <div class="progress" id="progress"></div>
</header>

<main id="top">
  {{ content }}
</main>

<footer>
  <div class="wrap"><span>© {{ site.time | date: '%Y' }} {{ site.author }} · <a href="{{ site.baseurl }}/">Portfolio</a> · <a href="https://github.com/{{ site.social-github }}" target="_blank" rel="noopener">GitHub</a> · <a href="https://www.linkedin.com/in/{{ site.social-linkedin }}/" target="_blank" rel="noopener">LinkedIn</a></span><span>Senior Software Engineer · Full-Stack · Brazil</span></div>
</footer>
</body>
</html>
