title: Allef Gomes
description: > # this means to ignore newlines until "baseurl:"
  I am a software developer focusing in backend with ruby, elixir and nodejs but I have expiriencies with Angular2+, ReactJs, React-Native, Ionic and others techs.
permalink: /:title/
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://allefgomes.github.io"
site-twitter: #if your site has a twitter account, enter it here

# Author Settings
author: Allef Gomes # add your name
author-img: allef-gomes.jpg # add your photo
about-author: Olá! Sou Allef Gomes, graduado em Sistemas para Internet e pós graduado em MBA em Engenharia de Software Ágil. Aqui pretendo escrever sobre meus aprendizados diários.
social-github: allefgomes
social-linkedin: allef-gomes
social-email: allefgalmeida@gmail.com

# Disqus
discus-identifier: mr-brown # add your discus identifier

# Build Settings
markdown: kramdown
plugins:
  - jekyll-sitemap
  - jemoji

# Languages: English is the default; anything under pt/ (pages and pt/_posts) is Portuguese.
# UI strings live in _data/i18n.yml.
defaults:
  - scope:
      path: ""
    values:
      lang: en
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "pt"
    values:
      lang: pt
      permalink: /pt/:title/

exclude: ["README.md"]
